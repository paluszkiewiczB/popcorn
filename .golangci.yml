# yaml-language-server: $schema=https://json.schemastore.org/golangci-lint.json
version: "2"
linters:
  default: all
  disable:
    - depguard
    - exhaustruct
    - gomodguard
    - nlreturn
    - noinlineerr
    - nonamedreturns
    - varnamelen
    - wsl
    - wsl_v5
    - whitespace
  settings:
    ireturn:
      # NewModule must return Module: the concrete type depends on whether the
      # recipe carries a Done channel, and callers assert TaskModule from it.
      allow:
        - anon
        - error
        - empty
        - stdlib
        - Module
  exclusions:
    rules:
      # Test files aggregate many independent scenarios, and synctest bubbles
      # forbid subtests, so fixture length/complexity limits do not apply.
      - path: _test\.go
        linters:
          - cyclop
          - funlen
          - gocognit
formatters:
  enable:
    - gofumpt
    - goimports
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
