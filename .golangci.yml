# yaml-language-server: $schema=https://json.schemastore.org/golangci-lint.json
version: "2"
linters:
  default: all
  disable:
    - depguard
    - exhaustruct
    - gomodguard
    - nlreturn
    - noinlineerr
    - nonamedreturns
    - varnamelen
    - wsl
    - wsl_v5
    - whitespace
formatters:
  enable:
    - gofumpt
    - goimports
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
