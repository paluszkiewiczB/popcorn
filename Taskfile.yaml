version: 3

set: [pipefail]

vars:
  TOOL_BIN: "{{.ROOT_DIR}}/.tools"
  REQUIRED_CODE_COVERAGE: "100"

env:
  GOTOOLCHAIN: go1.26.3+auto
  CGO_ENABLED: 0

tasks:
  test:
    desc: "Run all tests with coverage for the core packages"
    deps: [setup]
    cmds:
      - go test -count 1 -coverprofile=./bin/coverage.out ./...

  test:race:
    desc: "Run all tests with race detector (requires cgo)"
    deps: [setup]
    env:
      CGO_ENABLED: 1
    cmds:
      - go test -count 1 -race -coverpkg=./... ./...

  covercheck:
    desc: "Fail if total coverage is below REQUIRED_CODE_COVERAGE"
    preconditions:
      - test -f ./bin/coverage.out
    cmds:
      - |
        pct=$(go tool cover -func=./bin/coverage.out | awk '/^total:/{gsub("%","",$3); print $3}')
        echo "coverage: ${pct}% (required: {{.REQUIRED_CODE_COVERAGE}}%)"
        awk -v p="$pct" -v r="{{.REQUIRED_CODE_COVERAGE}}" \
          'BEGIN { if (p+0 < r+0) { printf "FAIL: coverage %s%% below required %s%%\n", p, r; exit 1 } }'

  ci:
    desc: "Quality gate: format, tidy, lint, tests, coverage"
    deps: [setup]
    cmds:
      - cmd: 'test -z "$({{.TOOL_BIN}}/gofumpt -l .)" || { echo "not gofumpted; run task fmt"; exit 1; }'
      - go mod tidy -diff
      - task: lint
      - task: test
      - task: covercheck

  deps:
    desc: "Download module dependencies"
    cmds:
      - go mod download

  fix:
    desc: "Apply auto-fixes from linters and formatters"
    deps: [tools]
    cmds:
      - "{{.TOOL_BIN}}/golangci-lint run --fix ./..."
      - "go fix ./..."

  fmt:
    desc: "Format with gofumpt"
    deps: [tools]
    cmds:
      - "{{.TOOL_BIN}}/gofumpt -l -w ."

  lint:
    desc: "Run linters"
    deps: [tools]
    cmds:
      - "{{.TOOL_BIN}}/golangci-lint run ./..."

  tools:
    desc: "Install tools from tools/go.mod into .tools/"
    cmds:
      - GOBIN={{.TOOL_BIN}} go -C tools install tool

  setup:
    desc: "Prepare local environment"
    deps:
      - tools
      - deps
    cmds:
      - mkdir -p ./bin

  default:
    cmds:
      - task -l
