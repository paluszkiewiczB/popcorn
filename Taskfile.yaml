version: 3

set: [pipefail]

vars:
  TOOL_BIN: "{{.ROOT_DIR}}/.tools"

env:
  GOTOOLCHAIN: go1.26.3+auto
  CGO_ENABLED: 0

tasks:
  test:
    desc: "Run all tests with coverage for the core packages"
    deps: [setup]
    cmds:
      - go test -count 1 -coverprofile=./bin/coverage.out ./...

  test:race:
    desc: "Run all tests with race detector (requires cgo)"
    deps: [setup]
    env:
      CGO_ENABLED: 1
    cmds:
      - go test -count 1 -race -coverpkg=./... ./...

  run:
    desc: "Run the example application"
    deps: [setup]
    cmds:
      - go run ./examples

  test:reports:
    desc: "Print total code coverage"
    preconditions:
      - test -f ./bin/coverage.out
    cmds:
      - go tool cover -func=./bin/coverage.out | awk '/total/{gsub("%","",$3); print $3}' > ./bin/totalCoverageReport.txt
      - echo "Total code coverage is $(cat ./bin/totalCoverageReport.txt)%"

  deps:
    desc: "Download module dependencies"
    cmds:
      - go mod download

  fmt:
    desc: "Format code with gofumpt"
    deps: [tools]
    cmds:
      - "{{.TOOL_BIN}}/gofumpt -extra -l -w ."

  lint:
    desc: "Run linters"
    deps: [tools]
    cmds:
      - '{{.TOOL_BIN}}/gofumpt -extra -l -e . | xargs --no-run-if-empty sh -c "echo ''code is not gofumpt-ed, run task fmt''; exit 1"'
      - "{{.TOOL_BIN}}/golangci-lint run ./..."

  tools:
    desc: "Install tools from tools/go.mod into .tools/"
    cmds:
      - GOBIN={{.TOOL_BIN}} go -C tools install tool

  setup:
    desc: "Prepare local environment"
    deps:
      - tools
      - deps
    cmds:
      - mkdir -p ./bin

  default:
    cmds:
      - task -l
